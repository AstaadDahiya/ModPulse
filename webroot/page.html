<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ModPulse Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; background: #0e1117; color: #8b949e; font-family: sans-serif;">
      <div style="width: 40px; height: 40px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <div style="font-size: 14px;">Loading dashboard...</div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- Error display for debugging -->
  <div id="error-display" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#2d1b1b; color:#f85149; padding:12px; font-family:monospace; font-size:11px; z-index:9999; max-height:30vh; overflow:auto;"></div>

  <script>
    // Catch and display all errors visually
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.innerHTML += '<div>' + msg + ' at ' + (src||'') + ':' + line + '</div>';
    };
  </script>

  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
